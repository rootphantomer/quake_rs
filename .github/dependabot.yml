# Dependabot 依赖更新配置
# 完整参数说明见：
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      # 固定周一早上生成更新 PR，避免周中插入提交干扰开发
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
    # 分组后每个分组只占 1 个 PR，5 个名额足够
    open-pull-requests-limit: 5
    # 直接依赖与传递依赖都纳入更新范围
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    # 按更新级别分组，把原先十几个独立 PR 收敛为 2 个。
    # 注意：分组仅对 version updates 生效，安全更新仍会单独提 PR。
    groups:
      # 补丁级更新：CI 通过后由 dependabot-auto-merge 工作流自动合并
      patch-updates:
        applies-to: version-updates
        update-types:
          - "patch"
      # 小版本更新：合并为一个 PR 集中评审，不自动合并
      minor-updates:
        applies-to: version-updates
        update-types:
          - "minor"
    # 主版本更新不分组，保持每个依赖一个独立 PR，逐个人工评估
