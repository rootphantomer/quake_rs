# 工作流名称，用于标识该 GitHub Actions 工作流
name: rust_build_test

# 工作流所需的权限，允许对仓库内容进行写入操作
permissions:
  contents: write

# 触发工作流的事件，当代码推送到 build_test 分支时触发
on:
  push:
    branches:
      - "build_test"

jobs:
  # 标记版本发布测试的任务
  tagged-release-test:
    name: "Tagged Release Test"
    # 指定运行该任务的环境为最新的 Ubuntu 系统
    runs-on: "ubuntu-latest"
    steps:
      # 检出代码到工作目录，使用固定版本 v7 提高稳定性
      - name: Checkout Code
        uses: actions/checkout@v7

      # 创建版本发布，使用固定版本 v3 提高稳定性
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # 使用 GitHub 提供的令牌进行认证
          token: "${{ secrets.GITHUB_TOKEN }}"
          # 固定使用 latest 作为标签名称，便于测试渠道分发
          tag_name: "latest"
          # 版本发布的标题
          name: "Rust Build Test"
          # 标记为预发布版本
          prerelease: true
          # 由 GitHub 依据 commit 记录自动生成发布说明
          generate_release_notes: true

  # 上传资产测试的任务
  upload-assets-test:
    name: "Upload assets"
    # 使用矩阵策略，在不同的操作系统和目标平台上运行任务
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # 支持 macOS 通用二进制文件
          - target: universal-apple-darwin
            os: macos-latest
    # 根据矩阵策略选择运行环境
    runs-on: ${{ matrix.os }}
    steps:
      # 检出代码到工作目录，使用固定版本 v7 提高稳定性
      - name: Checkout Code
        uses: actions/checkout@v7
      # 上传 Rust 二进制文件
      - name: "Upload rust binary"
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          # 当前 Git 引用
          ref: ${{ github.ref }}
          # 二进制文件名称
          bin: quake
          # 目标平台
          target: ${{ matrix.target }}
          # Unix 平台使用 tar 打包
          tar: unix
          # Windows 平台使用 zip 打包
          zip: windows
          # 使用 GitHub 提供的令牌进行认证
          token: ${{ secrets.GITHUB_TOKEN }}
